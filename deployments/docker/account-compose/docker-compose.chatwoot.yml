# Opt in only for an authorized app runtime. No Chatwoot admin/API credentials.
services:
  listingkit-ui:
    environment:
      CHATWOOT_ORIGIN: ${CHATWOOT_ORIGIN:?HTTPS support origin; HTTP allowed for loopback trials only}
      CHATWOOT_WEBSITE_TOKEN: ${CHATWOOT_WEBSITE_TOKEN:?Public token from the dedicated website inbox}
      CHATWOOT_IDENTITY_SECRET_FILE: /private/chatwoot/identity-secret
    volumes:
      - type: bind
        source: ${CHATWOOT_IDENTITY_SECRET_HOST_FILE:?Absolute path to a private inbox HMAC secret file}
        target: /private/chatwoot/identity-secret
        read_only: true
        bind: { create_host_path: false }
