apiVersion: v1
kind: Secret
metadata:
  name: listingkit-workbench-secret
type: Opaque
stringData:
  # Copy this file to secret.yaml or create the secret with kubectl/SealedSecret.
  # Do not commit real credentials.
  # Retained UI, ImageAgent and imgproxy manifests use explicit
  # per-key allowlists. The UI consumes only its Auth.js/ZITADEL keys; never
  # import this shared Secret wholesale into a workload.
  TASK_PROCESSOR_OPENAI_API_KEY: ""
  TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_API_KEY: ""
  TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_API_STYLE: "nanobanana"
  TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_BASE_URL: "https://grsai.dakka.com.cn/v1/draw/nano-banana"
  TASK_PROCESSOR_OPENAI_CLIENTS_IMAGE_MODEL: "nano-banana-fast"
  TASK_PROCESSOR_NANO_BANANA_API_KEY: ""
  # Core config binds database settings as individual env vars; DATABASE_DSN is
  # not consumed. Retained worker manifests select their required DB keys.
  # Normal schema CLIs keep their existing configuration and permission owner.
  TASK_PROCESSOR_DATABASE_HOST: "postgres.example.internal"
  TASK_PROCESSOR_DATABASE_PORT: "5432"
  TASK_PROCESSOR_DATABASE_USER: "listingkit"
  TASK_PROCESSOR_DATABASE_PASSWORD: ""
  TASK_PROCESSOR_DATABASE_NAME: "listingkit"
  TASK_PROCESSOR_COMMERCIAL_DATABASE_HOST: "commercial-postgres.example.internal"
  TASK_PROCESSOR_COMMERCIAL_DATABASE_PORT: "5432"
  TASK_PROCESSOR_COMMERCIAL_DATABASE_USER: "listingkit-commercial"
  TASK_PROCESSOR_COMMERCIAL_DATABASE_PASSWORD: ""
  TASK_PROCESSOR_COMMERCIAL_DATABASE_NAME: "commercial"
  TASK_PROCESSOR_S3_ENDPOINT: "https://oss.shuomiai.com"
  TASK_PROCESSOR_S3_BUCKET: "listingkit-assets"
  TASK_PROCESSOR_S3_ACCESS_KEY_ID: ""
  TASK_PROCESSOR_S3_SECRET_ACCESS_KEY: ""
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_S3_ACCESS_KEY_ID: ""
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_S3_SECRET_ACCESS_KEY: ""
  TASK_PROCESSOR_LISTINGKIT_IMAGE_UPLOAD_S3_ACCESS_KEY_ID: ""
  TASK_PROCESSOR_LISTINGKIT_IMAGE_UPLOAD_S3_SECRET_ACCESS_KEY: ""
  # Optional imgproxy signing secret. Leave empty when you use /img/insecure URLs.
  IMGPROXY_KEY: ""
  IMGPROXY_SALT: ""
  LISTINGKIT_BASIC_AUTH_USERNAME: "admin"
  LISTINGKIT_BASIC_AUTH_PASSWORD: ""
  AUTH_SECRET: ""
  # Public origin used by Auth.js when the UI runs behind the Kubernetes Ingress.
  AUTH_URL: "https://<workbench-host>"
  ZITADEL_ISSUER_URL: ""
  ZITADEL_CLIENT_ID: ""
  ZITADEL_CLIENT_SECRET: ""
  # The read-only tenant-directory token is not the OIDC web client secret.
  # Do not expose it to the UI, browser workers, imgproxy, or schema processes.
  # Write-capable member-invitation credentials must remain outside this shared
  # Secret. The current native identity flow retains its own credential owner.
  TASK_PROCESSOR_LISTINGKIT_ZITADEL_TENANT_DIRECTORY_TOKEN: ""
  # Auth.js callback URI should be https://<workbench-host>/api/auth/callback/zitadel
  ZITADEL_REDIRECT_URI: "https://<workbench-host>/api/auth/callback/zitadel"
  ZITADEL_POST_LOGOUT_REDIRECT_URI: ""
  # Retained authorization configuration. Authentication is mandatory and
  # cannot be disabled; these fields do not restore a retired API workload.
  TASK_PROCESSOR_LISTINGKIT_ZITADEL_AUTHZ_REQUIRED: "1"
  # Canonical authorization allowlists. Keep tenant and subject lists
  # empty to rely on role authorization unless explicit restrictions are needed.
  TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_TENANT_IDS: ""
  TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_USER_IDS: ""
  TASK_PROCESSOR_LISTINGKIT_ZITADEL_ALLOWED_ROLES: "listingkit_admin,listingkit_operator,listingkit_viewer,platform_admin"
  # Enterprise WeChat robot webhook used by the public demo request form.
  # Keep the real value in the deployed Secret, never in Git.
  LISTINGKIT_DEMO_WEBHOOK_URL: ""
