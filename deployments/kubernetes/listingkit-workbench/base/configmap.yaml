apiVersion: v1
kind: ConfigMap
metadata:
  name: listingkit-workbench-config
data:
  NEXT_TELEMETRY_DISABLED: "1"
  # Public Auth.js origin and callback proxy. Keep these in version-controlled
  # configuration so an OIDC login never falls back to a Pod-local address.
  AUTH_URL: "https://pod.shuomiai.com"
  AUTH_REDIRECT_PROXY_URL: "https://pod.shuomiai.com/api/auth"
  ZITADEL_REDIRECT_URI: "https://pod.shuomiai.com/api/auth/callback/zitadel"
  ZITADEL_POST_LOGOUT_REDIRECT_URI: "https://pod.shuomiai.com"
  LISTINGKIT_PUBLIC_BASE_URL: "https://pod.shuomiai.com"
  TASK_PROCESSOR_ENV: "prod"
  # ImageAgent admission gate replaces the retired ProductImage scene
  # governance canary: only the verified zone tenant is allowed to start
  # ImageAgent runs, so tasks blocked on approved assets can recover.
  TASK_PROCESSOR_IMAGEAGENT_ADMISSION_ENABLED: "true"
  TASK_PROCESSOR_IMAGEAGENT_ADMISSION_ALLOWED_TENANT_IDS: "373211199677923496"
  # ImageAgent durable artifacts and ListingKit manual uploads have separate
  # typed owners even when this deployment deliberately points both at one bucket.
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_PROVIDER: "s3"
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_ENABLED: "true"
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_PUBLIC_BASE: "https://oss.shuomiai.com"
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_S3_BUCKET: "shuomi-1303159911"
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_S3_REGION: "ap-hongkong"
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_S3_ENDPOINT: "https://cos.ap-hongkong.myqcloud.com"
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_S3_USE_PATH_STYLE: "false"
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_S3_ARTIFACT_MODE: "cos"
  TASK_PROCESSOR_IMAGEAGENT_ARTIFACT_STORE_S3_COS_IMMUTABLE_NON_VERSIONED_BUCKET_POLICY: "true"
  TASK_PROCESSOR_LISTINGKIT_IMAGE_UPLOAD_PROVIDER: "s3"
  TASK_PROCESSOR_LISTINGKIT_IMAGE_UPLOAD_S3_PUBLIC_BASE: "https://oss.shuomiai.com"
  TASK_PROCESSOR_LISTINGKIT_IMAGE_UPLOAD_S3_BUCKET: "shuomi-1303159911"
  TASK_PROCESSOR_LISTINGKIT_IMAGE_UPLOAD_S3_REGION: "ap-hongkong"
  TASK_PROCESSOR_LISTINGKIT_IMAGE_UPLOAD_S3_ENDPOINT: "https://cos.ap-hongkong.myqcloud.com"
  TASK_PROCESSOR_LISTINGKIT_IMAGE_UPLOAD_S3_USE_PATH_STYLE: "false"
  LISTINGKIT_IMGPROXY_BASE_URL: "https://listingkit.example.com/img"
  NEXT_PUBLIC_LISTINGKIT_IMGPROXY_BASE_URL: "https://listingkit.example.com/img"
  IMGPROXY_BIND: ":8080"
  IMGPROXY_PATH_PREFIX: "/img"
  IMGPROXY_USE_S3: "true"
  IMGPROXY_S3_BUCKET: "shuomi-1303159911"
  IMGPROXY_S3_REGION: "ap-hongkong"
  IMGPROXY_S3_ENDPOINT: "https://cos.ap-hongkong.myqcloud.com"
  IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "false"
  IMGPROXY_AUTO_WEBP: "true"
  IMGPROXY_AUTO_AVIF: "true"
  # ListingKit layer workflows and publish workflows run on Temporal when enabled.
  # Replace the address with the real Temporal frontend Service in the cluster.
  LISTINGKIT_TEMPORAL_ENABLED: "1"
  LISTINGKIT_TEMPORAL_ADDRESS: "temporal-frontend.temporal.svc.cluster.local:7233"
  LISTINGKIT_TEMPORAL_NAMESPACE: "default"
  LISTINGKIT_TEMPORAL_START_WORKER: "1"
  IMAGE_AGENT_TEMPORAL_ENABLED: "1"
  IMAGE_AGENT_TEMPORAL_ADDRESS: "temporal-frontend.temporal.svc.cluster.local:7233"
  IMAGE_AGENT_TEMPORAL_NAMESPACE: "default"
  # Set ZITADEL_ISSUER_URL and ZITADEL_CLIENT_ID to enable ZITADEL OIDC login.
