# Source example for a separately authorized fresh installation/namespace.
# Does not authorize applying over a retained numeric worker; see
# docs/operations/shein-login-worker-current.md. No resource/data cutover here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shein-login-worker
  labels:
    app: shein-login-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shein-login-worker
  template:
    metadata:
      labels:
        app: shein-login-worker
    spec:
      nodeSelector:
        task-processor/crawler-tier: heavy
      terminationGracePeriodSeconds: 45
      containers:
        - name: shein-login-worker
          image: xuwei190/task-processor-shein-login-worker:latest
          imagePullPolicy: IfNotPresent
          # Fresh-installation input only; never reuse numeric worker Secrets.
          args: ["-config", "/run/shein-login-worker/current.json", "-health-port", "8086"]
          ports:
            - name: health
              containerPort: 8086
          volumeMounts:
            # subPath exposes regular private files, not projected symlink paths.
            - name: worker-current
              mountPath: /run/shein-login-worker/current.json
              subPath: current.json
              readOnly: true
            - name: worker-current
              mountPath: /run/shein-login-worker/client-secret
              subPath: client-secret
              readOnly: true
            - name: worker-current
              mountPath: /run/shein-login-worker/service-token
              subPath: service-token
              readOnly: true
            - name: worker-current
              mountPath: /run/shein-login-worker/login.json
              subPath: login.json
              readOnly: true
            - name: tmp
              mountPath: /app/tmp
            - name: logs
              mountPath: /app/logs
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: worker-current
          secret:
            secretName: shein-login-worker-current
            defaultMode: 0400
            optional: false
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
