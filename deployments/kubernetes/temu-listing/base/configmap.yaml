apiVersion: v1
kind: ConfigMap
metadata:
  name: temu-listing-config
  namespace: task-processor
data:
  config-temu-listing.yaml: |
    logging:
      level: "INFO"
      format: "text"
      file: ""
      split_by_level: []

    openai:
      apiKey: ""
      model: "gemini-2.5-flash"
      baseURL: "https://ai.linkcloudai.com/v1"
      timeout: 300


    browser:
      enabled: true
      headless: true
      browserPath: "/usr/bin/chromium"
      poolSize: 2
      viewportWidth: 1920
      viewportHeight: 1080
      proxyServer: ""

    platforms:
      alibaba1688:
        enabled: false
        timeout: 120
        poolSize: 1

    amazon:
      enabled: false
      remoteAPI:
        enabled: true
        baseURL: "http://amazon-crawler-api.task-processor.svc.cluster.local:8080"
        timeout: 300

    redis:
      host: "redis-master.default.svc.cluster.local"
      port: 6379
      password: ""
      db: 0
      pool_size: 10

    prompts:
      dir: "./prompts"
      hotReload: false

    updater:
      enabled: false
