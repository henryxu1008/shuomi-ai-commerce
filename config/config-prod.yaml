# 统一开发环境配置
# 支持 TEMU 和 SHEIN 两个平台

# 日志配置
logging:
  level: "DEBUG"  # 设置为 DEBUG 级别以显示详细调试信息
  format: "text"  # text 或 json
  file: ".local/logs/app.log"
  split_by_level:
    - levels: [error, fatal, panic]
      file: .local/logs/error.log
    - levels: [warn]
      file: .local/logs/warn.log
    - levels: [info]
      file: .local/logs/info.log
    - levels: [debug, trace]
      file: .local/logs/debug.log


# OpenAI配置
openai:
  apiKey: ""
  model: "gemini-2.5-flash"
  baseURL: "https://ai.linkcloudai.com/v1"
  timeout: 300  # API调用超时5分钟
  clients:
    image:
      apiStyle: "nanobanana"
      model: "nanobanana"
      timeout: 300
  
  # 请求池配置 - 更保守的设置


listingkit:
  platformAdminUsers: []
  platformAdminRoles: []
  imageUpload:
    provider: "local"
    local:
      rootDir: "./.local/tmp/listingkit-uploads"
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      accessKeyID: ""
      secretAccessKey: ""
      usePathStyle: false
      publicBase: ""
  zitadel:
    # issuer/client secret are injected at runtime in Kubernetes.
    issuerURL: "https://auth.shuomiai.com"
    clientID: ""
    clientSecret: ""
    authorizationRequired: false
    allowedTenantIDs: []
    allowedUserIDs: []
    allowedRoles: []

platforms:
  # SHEIN 平台配置
  shein:
    # SHEIN 登录态刷新配置；线上 k8s 通过集群内 login Service 调用登录 API
  # SDS 登录态刷新配置；线上 k8s 通过集群内 login Service 调用登录 API
  sds:
    loginService:
      baseURL: "http://login:8000"
      sharedKey: ""
      tenantID: "1"
      identifier: "869"

  # 1688 平台配置
  alibaba1688:
    enabled: true   # 是否启用1688处理器
    timeout: 120    # 处理超时时间（秒）
    poolSize: 3     # 浏览器池大小
    
# 浏览器配置（通用）
browser:
  enabled: true
  headless: true   # false=可见模式（便于调试），true=无头模式
  browserPath: "./.local/chrome/chrome.exe"
  userDataDir: "./.local/tmp/browser-profiles/1688"
  poolSize: 5     # 浏览器池大小
  viewportWidth: 1920
  viewportHeight: 1080
  proxyServer: ""
  randomConfig:
    enabled: true
    strategy: "random"
    presetName: "windows_high_end"
    fingerprintStrategy: "random"
    healthCheckEnabled: true
    maxRetries: 3
    maxUsesPerInstance: 18  # 实例累计处理 18 个任务后主动轮换，避免 context 持续膨胀

# Amazon配置
amazon:
  # Amazon 爬虫配置
  enabled: true
  crawlTimeout: 300      # 爬虫超时时间（秒），默认5分钟
  # Amazon SP-API 配置（用于上架）
  # 注意：以下凭证仅为示例，请替换为你自己的真实凭证
  # 获取方法：登录 Amazon Seller Central > 设置 > 用户权限 > 开发者中心
  # 详细步骤：config/amazon-spapi-setup.md
  spapi:
    enabled: true
    region: "us-east-1"
    clientID: ""  # 请填写你的 Client ID
    clientSecret: ""  # 请填写你的 Client Secret
    refreshToken: ""  # 请填写你的 Refresh Token
    # AWS凭证（可选，用于API签名，某些操作可能需要）
    awsAccessKeyID: ""    # AWS Access Key ID（可选）
    awsSecretKey: ""      # AWS Secret Access Key（可选）
    defaultFulfillmentType: "FBM"
    defaultCondition: "New"
    
    # 多市场配置（可选，用于切换不同市场）
    defaultMarketplace: "ATVPDKIKX0DER"
    markets:
      us:
        name: "Amazon.com"
        marketplaceID: "ATVPDKIKX0DER"
        currency: "USD"
        sellerID: ""  # 与主配置保持一致
        enabled: true
      ca:
        name: "Amazon.ca"
        marketplaceID: "A2EUQ1WTGCTBG2"
        currency: "CAD"
        sellerID: ""
        enabled: true
      mx:
        name: "Amazon.com.mx"
        marketplaceID: "A1AM78C64UM0Y8"
        currency: "MXN"
        sellerID: ""
      br:
        name: "Amazon.com.br"
        marketplaceID: "A2Q3Y263D00KWC"
        currency: "BRL"
        sellerID: ""


# 数据库配置（AI 缓存持久化使用）
database:
  host: "postgres.example.internal"
  port: 30432
  user: "root"
  password: "replace-me"
  database: "ruoyi-vue-pro"
  max_connections: 10
  max_idle_connections: 5
  connection_max_lifetime: "1h"

imageagent:
  admission:
    enabled: false
    allowedTenantIDs: []
  artifactStore:
    enabled: false
    provider: "s3"
    publicBase: ""
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      accessKeyID: ""
      secretAccessKey: ""
      usePathStyle: false
      artifactMode: ""
      cosImmutableNonVersionedBucketPolicy: false
