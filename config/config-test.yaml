# 统一开发环境配置
# 支持 TEMU 和 SHEIN 两个平台

# OpenAI配置
openai:
  apiKey: ""
  model: "gemini-2.0-flash"
  baseURL: "https://ai.linkcloudai.com/v1"
  timeout: 300  # API调用超时5分钟
  clients:
    image:
      model: "nanobanana"
      timeout: 300


listingkit:
  platformAdminUsers: []
  platformAdminRoles: []
  imageUpload:
    provider: "local"
    local:
      rootDir: "./.local/tmp/listingkit-uploads-test"
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      accessKeyID: ""
      secretAccessKey: ""
      usePathStyle: false
      publicBase: ""
  zitadel:
    issuerURL: ""
    clientID: ""
    clientSecret: ""
    authorizationRequired: false
    allowedTenantIDs: []
    allowedUserIDs: []
    allowedRoles: []

platforms:
  # 1688 平台配置
  alibaba1688:
    enabled: false   # 是否启用1688处理器
    timeout: 120    # 处理超时时间（秒）
    poolSize: 3     # 浏览器池大小

# 浏览器配置（通用）
browser:
  enabled: true
  headless: true  # false=可见模式（便于调试），true=无头模式
  browserPath: "./.local/chrome/chrome.exe"
  poolSize: 3     # 浏览器池大小
  viewportWidth: 1920
  viewportHeight: 1080
  proxyServer: ""
  randomConfig:
    enabled: true
    strategy: "random"
    presetName: "windows_high_end"
    fingerprintStrategy: "random"
    healthCheckEnabled: true
    maxRetries: 3
    maxUsesPerInstance: 8

# Amazon配置
amazon:
  # Amazon 爬虫配置
  enabled: false
  crawlTimeout: 300      # 爬虫超时时间（秒），默认5分钟

  # Amazon SP-API 配置（用于上架）
  # 注意：以下凭证仅为示例，请替换为你自己的真实凭证
  # 获取方法：登录 Amazon Seller Central > 设置 > 用户权限 > 开发者中心
imageagent:
  admission:
    enabled: false
    allowedTenantIDs: []
  artifactStore:
    enabled: false
    provider: "s3"
    publicBase: ""
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      accessKeyID: ""
      secretAccessKey: ""
      usePathStyle: false
      artifactMode: ""
      cosImmutableNonVersionedBucketPolicy: false
