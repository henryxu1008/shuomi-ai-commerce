# golangci-lint 配置文件
# 文档: https://golangci-lint.run/usage/configuration/

run:
  # 超时时间
  timeout: 5m

  # 要检查的目录
  tests: true

# 输出配置
output:
  # 输出格式: colored-line-number|line-number|json|tab|checkstyle|code-climate
  formats:
    - format: colored-line-number

  # 打印检查的linter名称
  print-issued-lines: true
  print-linter-name: true

# Linters 配置
linters:
  # 禁用所有默认linters
  disable-all: true

  # 启用的linters
  enable:
    # 基础检查
    - gosimple      # 简化代码建议
    - govet         # go vet检查
    - ineffassign   # 检查无效的赋值
    - staticcheck   # 静态分析检查
    - depguard     # 检查稳定的包依赖方向

    # 代码风格
    - gofmt         # 检查代码格式
    - goimports     # 检查import顺序
    - unconvert     # 检查不必要的类型转换

# Linters 设置
linters-settings:
  depguard:
    rules:
      legacy_compatibility_consumer_freeze:
        # Exact drain caller exclusions; import-boundary tests freeze each edge.
        files:
          - "**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/compatibility$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/compatibility/"

      legacy_tenantbridge_consumer_freeze:
        # Exact drain caller exclusions; import-boundary tests freeze each edge.
        files:
          - "**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/tenantbridge$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/tenantbridge/"

      current_owners_legacy_listingkit_root:
        files:
          - "**/internal/product/*.go"
          - "**/internal/product/**/*.go"
          - "**/internal/listing/*.go"
          - "**/internal/listing/**/*.go"
          - "**/internal/marketplace/*.go"
          - "**/internal/marketplace/**/*.go"
          - "**/internal/agent/*.go"
          - "**/internal/agent/**/*.go"
          - "**/internal/agentconfig/*.go"
          - "**/internal/agentconfig/**/*.go"
          - "**/internal/commercetool/*.go"
          - "**/internal/commercetool/**/*.go"
          - "**/internal/console/*.go"
          - "**/internal/console/**/*.go"
          - "**/internal/businesstask/*.go"
          - "**/internal/businesstask/**/*.go"
          - "**/internal/storecenter/*.go"
          - "**/internal/storecenter/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listingkit$"
            desc: "EXTRACT behavior to current owners; never wrap the legacy root service"

      target_domain_concrete_infrastructure:
        files:
          - "**/internal/listing/*.go"
          - "**/internal/listing/**/*.go"
          - "**/internal/product/*.go"
          - "**/internal/product/**/*.go"
          - "**/internal/marketplace/*.go"
          - "**/internal/marketplace/**/*.go"
          - "**/internal/agent/*.go"
          - "**/internal/agent/**/*.go"
          - "**/internal/knowledge/*.go"
          - "**/internal/knowledge/**/*.go"
          - "**/internal/resourcecatalog/*.go"
          - "**/internal/resourcecatalog/**/*.go"
          - "**/internal/commercial/*.go"
          - "**/internal/commercial/**/*.go"
          - "**/internal/ledger/*.go"
          - "**/internal/ledger/**/*.go"
          - "**/internal/organization/*.go"
          - "**/internal/organization/**/*.go"
          - "**/internal/sourceaccountregistry/*.go"
          - "**/internal/sourceaccountregistry/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/platform$"
            desc: "domains depend on local ports, never platform implementations"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/platform/"
            desc: "domains depend on local ports, never platform implementations"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/integration$"
            desc: "app owns adapter wiring"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/integration/"
            desc: "app owns adapter wiring"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra$"
            desc: "retired infrastructure roots are not domain contracts"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/"
            desc: "retired infrastructure roots are not domain contracts"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/app$"
            desc: "app is the composition root, never a domain dependency"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/app/"
            desc: "app is the composition root, never a domain dependency"
          - pkg: "gorm.io$"
            desc: "persistence SDKs belong to integration adapters"
          - pkg: "gorm.io/"
            desc: "persistence SDKs belong to integration adapters"
          - pkg: "go.temporal.io$"
            desc: "Temporal runtime belongs to platform and app wiring"
          - pkg: "go.temporal.io/"
            desc: "Temporal runtime belongs to platform and app wiring"
          - pkg: "go.opentelemetry.io$"
            desc: "observability SDKs belong to platform and app wiring"
          - pkg: "go.opentelemetry.io/"
            desc: "observability SDKs belong to platform and app wiring"
          - pkg: "github.com/open-feature$"
            desc: "feature provider SDKs belong to platform adapters"
          - pkg: "github.com/open-feature/"
            desc: "feature provider SDKs belong to platform adapters"
          - pkg: "github.com/aws$"
            desc: "AWS SDKs belong to integration adapters"
          - pkg: "github.com/aws/"
            desc: "AWS SDKs belong to integration adapters"
          - pkg: "github.com/redis$"
            desc: "Redis SDKs belong to platform adapters"
          - pkg: "github.com/redis/"
            desc: "Redis SDKs belong to platform adapters"
          - pkg: "github.com/rabbitmq$"
            desc: "RabbitMQ SDKs belong to platform adapters"
          - pkg: "github.com/rabbitmq/"
            desc: "RabbitMQ SDKs belong to platform adapters"

      phase3_product_domain_boundaries:
        files:
          - "**/internal/product/catalog/**/*.go"
          - "**/internal/product/sourcing/**/*.go"
          - "**/internal/product/review/proposal/**/*.go"
          - "**/internal/product/asset/**/*.go"
          - "**/internal/product/image/**/*.go"
          - "**/internal/product/review/*.go"
          - "**/internal/product/review/**/*.go"
        deny:
          - pkg: github.com/henryxu1008/shuomi-ai-commerce/internal/app
          - pkg: github.com/henryxu1008/shuomi-ai-commerce/internal/platform
          - pkg: github.com/henryxu1008/shuomi-ai-commerce/internal/integration
          - pkg: gorm.io/gorm
          - pkg: go.temporal.io
          - pkg: github.com/aws/aws-sdk-go-v2
          - pkg: github.com/aws/smithy-go
          - pkg: github.com/sashabaranov/go-openai
          - pkg: github.com/tencentcloud/tencentcloud-sdk-go

      phase3_retired_product_imports:
        # Final Phase 3 hard cut: retired roots and the test-only asset helper
        # must never regain production consumers.
        files:
          - "**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/catalog$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/catalog/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/asset$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/asset/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/imageasset$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/imageasset/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/productenrich$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/productenrich/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/productimage$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/productimage/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/product/asset/assettest$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/product/asset/assettest/"

      phase3_product_consumers_read_only:
        # ListingKit, SDS and AmazonListing consume only product snapshots and
        # approved assets; ImageAgent remains the sole image workflow owner.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
          - "**/internal/sds/*.go"
          - "**/internal/sds/**/*.go"
          - "**/internal/amazonlisting/*.go"
          - "**/internal/amazonlisting/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/product/image$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/product/image/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/imageagent/store$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/imageagent/store/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/imageagent/temporal$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/imageagent/temporal/"

      platform_domain_dependencies:
        files:
          - "**/internal/platform/*.go"
          - "**/internal/platform/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listing$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listing/"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/product$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/product/"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/marketplace$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/marketplace/"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/agent$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/agent/"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/knowledge$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/knowledge/"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/resourcecatalog$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/resourcecatalog/"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/commercial$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/commercial/"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/ledger$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/ledger/"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/organization$"
            desc: "platform is domain neutral"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/organization/"
            desc: "platform is domain neutral"

      phase2_retired_runtime_paths:
        # Phase 2 moved these runtime packages to app, platform, integration,
        # or shared owners. Apply this rule to every production Go file so a
        # legacy import cannot be reintroduced from an unclassified package.
        files:
          - "**/internal/*.go"
          - "**/internal/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/core/lifecycle$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/core/lifecycle/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/database$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/database/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/redisclient$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/redisclient/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/lock$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/lock/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/rabbitmq$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/rabbitmq/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/worker$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/worker/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/clients/openai$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/clients/openai/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/clients/geminiimage$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/clients/geminiimage/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/clients/grsai$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/clients/grsai/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/storage$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/storage/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/resilience$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/resilience/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/metrics$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/metrics/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/monitoring$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/monitoring/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/safeimagehttp$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/safeimagehttp/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/hashx$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/hashx/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/mathx$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/mathx/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/ptr$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/ptr/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/strx$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/strx/"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/timex$"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/timex/"

      shein_marketplace_publishing:
        # Keep this first rule narrow: migration-specific exceptions remain in
        # tests/import_boundaries_test.go until their contracts are stable.
        list-mode: lax
        files:
          - "**/internal/marketplace/shein/publishing/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listingkit"
            desc: "SHEIN publishing policies must not depend on ListingKit"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/app"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/httpbootstrap"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/httproute"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/integration"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/platform"
            desc: "SHEIN publishing policies must not depend on root runtime wiring"

      temu_marketplace_publishing:
        # Keep the first TEMU policy owner independent from the historical TEMU runtime.
        files:
          - "**/internal/marketplace/temu/publishing/*.go"
          - "**/internal/marketplace/temu/publishing/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/temu"
            desc: "TEMU publishing policies must not depend on historical TEMU runtime"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listingkit"
            desc: "TEMU publishing policies must not depend on ListingKit"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/app"
            desc: "TEMU publishing policies must not depend on root runtime wiring"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra"
            desc: "TEMU publishing policies must not depend on root runtime wiring"

      temu_historical_facades:
        # Numeric formatting now has one owner under marketplace publishing;
        # do not recreate the retired forwarding package in the historical tree.
        files:
          - "**/internal/temu/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/temu/format"
            desc: "TEMU numeric formatting belongs to marketplace publishing"

      listingkit_marketplace_publishing:
        # This package direction is stable and has no compatibility exceptions.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/marketplace/shein/publishing"
            desc: "ListingKit production code must not depend on SHEIN publishing policies"

      listingkit_legacy_shein_runtime:
        # Keep ListingKit independent from legacy SHEIN runtime implementation packages.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/shein/pipeline"
            desc: "ListingKit production code must not depend on the legacy SHEIN pipeline"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/shein/publish"
            desc: "ListingKit production code must not depend on the legacy SHEIN publish package"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/shein/product/build"
            desc: "ListingKit production code must not depend on the legacy SHEIN product builder"

      listingkit_shein_api_root:
        # Keep ListingKit free of the SHEIN API root package; subpackage adapters remain explicit seams.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
          - "**/internal/listingkit/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/shein/api$"
            desc: "ListingKit production code must not depend on the SHEIN API root package"

      listingkit_root_management_api:
        # Keep the ListingKit root facade free of concrete management DTO contracts.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/infra/clients/management/api$"
            desc: "ListingKit root production code must not depend on management API DTO contracts"

      listing_preview_platform_neutral:
        # Old Task preview/platform and listing downloader owners are retired.
        # Tests/debug/build-constrained imports are also protected by the decoded-import guard.
        files:
          - "**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listing/preview$"
            desc: "Old Task preview and listing image-download owners are retired"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listing/preview/"
            desc: "Old Task preview and listing image-download owners are retired"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listing/platform$"
            desc: "Old Task preview and listing image-download owners are retired"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listing/platform/"
            desc: "Old Task preview and listing image-download owners are retired"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/downloader$"
            desc: "Old Task preview and listing image-download owners are retired"
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/pkg/downloader/"
            desc: "Old Task preview and listing image-download owners are retired"

      listingkit_subdomains_root_facade:
        # ListingKit subdomains must not depend back on the root facade package.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/generation/*.go"
          - "**/internal/listingkit/generation/**/*.go"
          - "**/internal/listingkit/submission/*.go"
          - "**/internal/listingkit/submission/**/*.go"
          - "**/internal/listingkit/workflow/*.go"
          - "**/internal/listingkit/workflow/**/*.go"
          - "**/internal/listingkit/workspace/*.go"
          - "**/internal/listingkit/workspace/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listingkit$"
            desc: "ListingKit subdomains must not depend on the root facade package"

      listingkit_root_workspace_shein:
        # Root ListingKit files must use the compatibility bridge instead of the legacy workspace domain.
        # The repository-wide issues.exclude-files excludes _test.go; test-only imports stay outside this guard.
        files:
          - "**/internal/listingkit/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/workspace/shein$"
            desc: "ListingKit root production code must not depend on the legacy workspace SHEIN domain"

      project_boundary_listingkit:
        # Project boundary packages must not depend on the ListingKit compatibility facade or its subpackages.
        # The repository-wide issues.exclude-files excludes _test.go; TestProjectBoundaryDomainsDoNotImportListingKitFacade retains semantic coverage for all project-boundary files.
        files:
          - "**/internal/amazon/*.go"
          - "**/internal/amazon/**/*.go"
          - "**/internal/product/asset/*.go"
          - "**/internal/product/asset/**/*.go"
          - "**/internal/product/catalog/*.go"
          - "**/internal/product/catalog/**/*.go"
          - "**/internal/product/review/proposal/*.go"
          - "**/internal/product/review/proposal/**/*.go"
          - "**/internal/product/image/*.go"
          - "**/internal/product/image/**/*.go"
          - "**/internal/infra/*.go"
          - "**/internal/infra/**/*.go"
          - "**/internal/integration/*.go"
          - "**/internal/integration/**/*.go"
          - "**/internal/marketplace/*.go"
          - "**/internal/marketplace/**/*.go"
          - "**/internal/platform/*.go"
          - "**/internal/platform/**/*.go"
          - "**/internal/product/sourcing/*.go"
          - "**/internal/product/sourcing/**/*.go"
          - "**/internal/publishing/*.go"
          - "**/internal/publishing/**/*.go"
          - "**/internal/shein/*.go"
          - "**/internal/shein/**/*.go"
          - "**/internal/temu/*.go"
          - "**/internal/temu/**/*.go"
          - "**/internal/workspace/*.go"
          - "**/internal/workspace/**/*.go"
        deny:
          - pkg: "github.com/henryxu1008/shuomi-ai-commerce/internal/listingkit$"
            desc: "Project boundary packages must not depend on the ListingKit root facade"
